<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>MSN HR Dashboard — Brand Mark</title>
</head>
<body style="margin:0; padding:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#0F172A 0%,#1E293B 50%,#334155 100%); font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">

    <div style="text-align:center; padding:40px; max-width:900px;">

        <!-- The brand mark, on a clean white card -->
        <div style="background:#ffffff; border-radius:32px; padding:60px; box-shadow:0 40px 80px -20px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.05); display:inline-block;">
            <img src="HR_DASHBOARD.svg"
                 alt="MSN HR Dashboard logo"
                 style="display:block; max-width:600px; width:100%; height:auto;"/>
        </div>

        <!-- Caption beneath -->
        <div style="margin-top:50px; color:#fff;">
            <div style="font-size:11px; font-weight:700; letter-spacing:0.2em; text-transform:uppercase; color:#94a3b8; margin-bottom:14px;">
                MSN · For Odoo 19 Enterprise
            </div>
            <h1 style="margin:0 0 12px; font-size:42px; font-weight:800; letter-spacing:-0.02em; color:#fff;">
                HR Dashboard
            </h1>
            <p style="margin:0; color:#cbd5e1; font-size:16px;">
                Brand Mark
            </p>
        </div>

    </div>

</body>
</html>
